[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "ibis-backend"
version = "0.1.0"
description = "Ibis backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ibis" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.1",
  "passlib>=1.7.4",
  "python-jose>=3.3.0",
  "python-multipart>=0.0.21",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
worker = [
  "openai-whisper>=20231117",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ibis_backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
